[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "m8_incremental"
version = "1.0.0"
description = "M8 Incremental — cargas semanales/mensuales automatizadas"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
